plugins { id 'com.android.application' version '8.5.2' }

android {
    namespace 'org.privacybubble.oidcprobe'
    compileSdk 35
    defaultConfig { applicationId 'org.privacybubble.oidcprobe'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        main.java.srcDir "$buildDir/generated/probe-java"
        debug.res.srcDir "$buildDir/generated/probe-res"
    }
}

def stageTestCa = tasks.register('stageTestCa', Copy) {
    from file('../../../../../.local/oidc-mock/ca.pem')
    into "$buildDir/generated/probe-res/raw"
    rename { 'oidc_test_ca.pem' }
    doFirst { if (!file('../../../../../.local/oidc-mock/ca.pem').isFile()) throw new GradleException('Create the workspace-only mock CA first') }
}
def stageAuth = tasks.register('stageAuth', Copy) {
    from file('../../app/src/main/java/org/privacybubble/app/auth')
    include 'OidcProvider.java', 'IdTokenVerifier.java', 'OidcRedirect.java', 'OidcTokenTransport.java'
    into "$buildDir/generated/probe-java/org/privacybubble/app/auth"
}
def stageApiTransport = tasks.register('stageApiTransport', Copy) {
    from file('../../app/src/main/java/org/privacybubble/app/api/HttpsApiTransport.java')
    into "$buildDir/generated/probe-java/org/privacybubble/app/api"
}
def stageTlsFactory = tasks.register('stageTlsFactory', Copy) {
    from file('../../app/src/main/java/org/privacybubble/app/net/Tls13SocketFactory.java')
    into "$buildDir/generated/probe-java/org/privacybubble/app/net"
}
tasks.matching { it.name == 'preDebugBuild' }.configureEach { dependsOn stageTestCa, stageAuth, stageApiTransport, stageTlsFactory }
dependencies { implementation 'com.nimbusds:nimbus-jose-jwt:9.47' }

// This separate APK exists only for synthetic local testing, never release distribution.
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant -> variant.enable = false }
}

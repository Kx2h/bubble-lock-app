plugins { id 'com.android.application' }

def profileString = { name, fallback = '' ->
    def value = providers.gradleProperty(name).orElse(fallback).get()
    if (value.contains('\n') || value.contains('\r') || value.length() > 2048) throw new GradleException('Invalid mobile profile value: ' + name)
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}
def configuredIssuer = providers.gradleProperty('oidcIssuer').orElse('').get()
def configuredClient = providers.gradleProperty('oidcClientId').orElse('').get()
def configuredApi = providers.gradleProperty('mobileApiBaseUrl').orElse('').get()
def configuredContract = providers.gradleProperty('mobileApiContract').orElse('keyrings-v1').get()
if (!(configuredContract in ['keyrings-v1', 'portal-central-v1', 'portal-web-v1']))
    throw new GradleException('Unknown mobile API contract')
def configuredAuth = !configuredIssuer.isEmpty() || !configuredClient.isEmpty() || !configuredApi.isEmpty()
if (configuredAuth) {
    if (configuredIssuer.isEmpty() || configuredClient.isEmpty() || configuredApi.isEmpty())
        throw new GradleException('A production sign-in profile requires mobileApiBaseUrl, oidcIssuer and oidcClientId together')
    [configuredIssuer, configuredApi].each { value ->
        def uri = new URI(value)
        if (uri.scheme != 'https' || uri.host == null || uri.userInfo != null || uri.query != null || uri.fragment != null || uri.port == 0 || uri.port > 65535)
            throw new GradleException('Mobile profile origins must be HTTPS without credentials, query or fragment')
    }
    if (!(new URI(configuredApi).rawPath in [null, '', '/']) || configuredClient.length() > 256 || configuredClient.find(/[\x00-\x20\x7f]/))
        throw new GradleException('Invalid mobile API origin or OIDC client identifier')
}

def oidcTestCa = providers.gradleProperty('oidcTestCa').orNull
if (oidcTestCa != null) {
    def allowed = file("${rootDir}/../../../.local/oidc-mock/ca.pem").canonicalFile
    if (!allowed.isFile() || file(oidcTestCa).canonicalFile != allowed) {
        throw new GradleException('oidcTestCa must be the workspace .local/oidc-mock/ca.pem')
    }
}

def serverPortalOrigin = providers.gradleProperty('serverPortalOrigin').orElse('').get()
def serverPortalCertificate = providers.gradleProperty('serverPortalCertificate').orNull
def serverPortalConfigured = !serverPortalOrigin.isEmpty() || serverPortalCertificate != null
def serverPortalHost = '', serverPortalPin = '', serverPortalPem = ''
def serverPortalCertificateFile = null
if (serverPortalConfigured) {
    if (serverPortalOrigin.isEmpty() || serverPortalCertificate == null || oidcTestCa != null || configuredAuth)
        throw new GradleException('serverPortalOrigin and serverPortalCertificate are required together, separately from native OIDC and oidcTestCa profiles')
    def uri = new URI(serverPortalOrigin)
    def host = uri.host?.toLowerCase(java.util.Locale.ROOT)
    if (uri.scheme != 'https' || host == null || uri.userInfo != null || uri.query != null || uri.fragment != null
            || !(uri.rawPath in ['', '/']) || uri.port == 0 || uri.port > 65535
            || !host.matches('[a-z0-9-]+(?:\\.[a-z0-9-]+)+') || host.length() > 253
            || host.split('\\.').any { it.length() > 63 || it.startsWith('-') || it.endsWith('-') }
            || !host.tokenize('.').last().matches('[a-z][a-z0-9-]*')
            || host.matches('.*\\.(localhost|local|localdomain|internal|home\\.arpa)$')
            || !uri.rawAuthority.equalsIgnoreCase(host + (uri.port == -1 ? '' : ':' + uri.port)))
        throw new GradleException('serverPortalOrigin must be one exact public HTTPS origin')
    serverPortalHost = host
    serverPortalOrigin = 'https://' + host + (uri.port == -1 || uri.port == 443 ? '' : ':' + uri.port)
    def workspaceLocal = file("${rootDir}/../../../.local").canonicalFile
    def allowed = file("${workspaceLocal}/deployment-connect-20261114/server.pem").canonicalFile
    serverPortalCertificateFile = file(serverPortalCertificate).canonicalFile
    if (!allowed.isFile() || serverPortalCertificateFile != allowed
            || !allowed.toPath().startsWith(workspaceLocal.toPath()) || allowed.length() > 65536)
        throw new GradleException('serverPortalCertificate must be the fixed workspace .local/deployment-connect-20261114/server.pem')
    def pem = allowed.getText('US-ASCII')
    if (!(pem ==~ /(?s)\s*-----BEGIN CERTIFICATE-----[A-Za-z0-9+\/=\r\n]+-----END CERTIFICATE-----\s*/))
        throw new GradleException('The server portal input must contain one public certificate')
    def certificate = java.security.cert.CertificateFactory.getInstance('X.509')
            .generateCertificate(new ByteArrayInputStream(allowed.bytes))
    certificate.checkValidity()
    if (!certificate.subjectAlternativeNames?.any { it[0] == 2 && host.equalsIgnoreCase(it[1].toString()) }
            || (certificate.extendedKeyUsage != null && !certificate.extendedKeyUsage.contains('1.3.6.1.5.5.7.3.1')))
        throw new GradleException('The server portal certificate must cover the exact HTTPS hostname and server authentication')
    serverPortalPin = java.util.Base64.encoder.encodeToString(java.security.MessageDigest.getInstance('SHA-256').digest(certificate.publicKey.encoded))
    serverPortalPem = '-----BEGIN CERTIFICATE-----\n' + java.util.Base64.getMimeEncoder(64, '\n'.bytes).encodeToString(certificate.encoded) + '\n-----END CERTIFICATE-----\n'
}

apply from: '../security/export-dependencies.gradle'

android {
    namespace 'org.privacybubble.app'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'org.privacybubble.app'
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName '0.5.0'
        testInstrumentationRunner 'org.privacybubble.app.security.SessionSecurityInstrumentation'
        buildConfigField 'String', 'MOBILE_API_BASE_URL', profileString('mobileApiBaseUrl')
        buildConfigField 'String', 'MOBILE_API_CONTRACT', profileString('mobileApiContract', 'keyrings-v1')
        buildConfigField 'String', 'OIDC_ISSUER', profileString('oidcIssuer')
        buildConfigField 'String', 'OIDC_CLIENT_ID', profileString('oidcClientId')
        buildConfigField 'String', 'MAP_STYLE_URL', profileString('mapStyleUrl', 'https://tiles.openfreemap.org/styles/liberty')
        buildConfigField 'String', 'SERVER_PORTAL_ORIGIN', '"' + serverPortalOrigin + '"'
        manifestPlaceholders = [appAuthRedirectScheme: 'org.privacybubble.app']
    }
    buildTypes {
        debug { buildConfigField 'boolean', 'OIDC_TEST_ENABLED', (oidcTestCa != null).toString() }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'boolean', 'OIDC_TEST_ENABLED', 'false'
        }
    }
    if (oidcTestCa != null) {
        sourceSets.debug {
            manifest.srcFile 'src/oidcTest/AndroidManifest.xml'
            java.srcDir 'src/oidcTest/java'
            res.setSrcDirs(['src/oidcTest/res', "$buildDir/generated/oidc-test/res"])
        }
    }
    if (configuredAuth) {
        sourceSets.release.manifest.srcFile 'src/productionAuth/AndroidManifest.xml'
    }
    if (serverPortalConfigured) {
        ['debug', 'release'].each { variant ->
            sourceSets[variant].manifest.srcFile "$buildDir/generated/server-portal/${variant}/AndroidManifest.xml"
            sourceSets[variant].res.setSrcDirs(["$buildDir/generated/server-portal/res"])
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.maplibre.gl:android-sdk-vulkan-opengl:13.7.1'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'
    implementation project(':appauth-patched')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
}

if (oidcTestCa != null) {
    def stageOidcTestCa = tasks.register('stageOidcTestCa', Copy) {
        from file(oidcTestCa)
        into "$buildDir/generated/oidc-test/res/raw"
        rename { 'oidc_test_ca.pem' }
    }
    tasks.matching { it.name == 'preDebugBuild' }.configureEach { dependsOn stageOidcTestCa }
}

if (serverPortalConfigured) {
    def output = file("$buildDir/generated/server-portal")
    def stageServerPortal = tasks.register('stageServerPortal') {
        inputs.file serverPortalCertificateFile
        inputs.property 'origin', serverPortalOrigin
        inputs.property 'pin', serverPortalPin
        inputs.file 'src/debug/AndroidManifest.xml'
        inputs.file(configuredAuth ? 'src/productionAuth/AndroidManifest.xml' : 'src/release/AndroidManifest.xml')
        outputs.dir output
        doLast {
            def raw = new File(output, 'res/raw'); raw.mkdirs()
            new File(raw, 'server_portal_certificate.pem').setText(serverPortalPem, 'US-ASCII')
            def xml = new File(output, 'res/xml'); xml.mkdirs()
            new File(xml, 'network_security_config.xml').setText("""<network-security-config xmlns:tools="http://schemas.android.com/tools">
    <base-config cleartextTrafficPermitted="false"><trust-anchors><certificates src="system" /></trust-anchors></base-config>
    <domain-config cleartextTrafficPermitted="false">
        <domain includeSubdomains="false">${serverPortalHost}</domain>
        <trust-anchors><certificates src="@raw/server_portal_certificate" /></trust-anchors>
        <!-- One user-approved private leaf; key rotation requires an updated application profile. -->
        <pin-set tools:ignore="MissingBackupPin"><pin digest="SHA-256">${serverPortalPin}</pin></pin-set>
    </domain-config>
</network-security-config>
""", 'UTF-8')
            ['debug', 'release'].each { variant ->
                def source = variant == 'debug' ? 'src/debug/AndroidManifest.xml'
                        : configuredAuth ? 'src/productionAuth/AndroidManifest.xml' : 'src/release/AndroidManifest.xml'
                def manifest = file(source).getText('UTF-8')
                if (!manifest.contains('xmlns:tools=')) manifest = manifest.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ')
                manifest = manifest.replace('</application>', '''<activity android:name=".MainActivity" android:exported="false" tools:replace="android:exported"><intent-filter tools:node="removeAll" /></activity>
        <activity android:name=".ServerPortalActivity" android:exported="true" tools:replace="android:exported">
            <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
        </activity>
    </application>''')
                def directory = new File(output, variant); directory.mkdirs()
                new File(directory, 'AndroidManifest.xml').setText(manifest, 'UTF-8')
            }
        }
    }
    tasks.matching { it.name in ['preDebugBuild', 'preReleaseBuild'] }.configureEach { dependsOn stageServerPortal }
}

# Include inside the reviewed HTTPS server for {{PUBLIC_HOST}}.
# Keep its existing verified public TLS certificate and security-header policy.
# The exact native read route wins over the /v1/ denial below.
location = /v1/portal/locations {
    if ($request_method != GET) { return 405; }
    if ($args != "") { return 400; }
    if ($bubble_mobile_body_forbidden) { return 400; }
    if ($http_authorization = "") { return 401; }

    limit_req zone=bubble_mobile_location burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;

    # Preserve the exact URI, bearer, and only the headers this endpoint needs.
    proxy_pass {{UPSTREAM_ORIGIN}};
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host {{UPSTREAM_AUTHORITY}};
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Accept application/json;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_ssl_protocols TLSv1.3;
    proxy_ssl_server_name on;
    proxy_ssl_name {{UPSTREAM_TLS_NAME}};
    proxy_ssl_trusted_certificate {{UPSTREAM_CA_FILE}};
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    # Prevent inherited proxy mTLS from elevating a user into a Gateway identity.
    proxy_ssl_certificate "";
    proxy_ssl_certificate_key "";

    proxy_connect_timeout 3s;
    proxy_send_timeout 3s;
    proxy_read_timeout 4s;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_buffering off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    expires off;
    # The integration API supplies Cache-Control:no-store, private and Vary:Authorization.
    # Preserve those headers and the existing server security headers.
}

# No public proxy for portal writes, enrollment, dispatch or other /v1/ routes.
# Existing authenticated Gateway routes on separate/private ingress remain separate.
location ^~ /v1/ {
    return 403;
}

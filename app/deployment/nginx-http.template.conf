# Include once in http {} after review, not inside server {}.
# Key is the trusted socket peer IP; never use a caller-supplied principal/header.
limit_req_zone $binary_remote_addr zone=bubble_mobile_location:10m rate=5r/s;

map "$http_content_length:$http_transfer_encoding" $bubble_mobile_body_forbidden {
    default 1;
    ":" 0;
    "0:" 0;
}
